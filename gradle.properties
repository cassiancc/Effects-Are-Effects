# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
fabric.loom.dropNonIntermediateRootMethods=true

# Mod Properties
mod.version=1.0.1
mod.id=embers_and_icicles
mod.name=Embers and Icicles
mod.description=An expansion on Fire and Ice, featuring status effects for Burning and Freezing and backports from 26.4.
mod.license=MIT
mod.group=cc.cassian.effects

# Fabric Properties
# check these on https://fabricmc.net/develop
deps.fabric_loader=0.19.5
loomx.loom_version = 1.17-SNAPSHOT
loomx.loom_remap_plugin = org.relativitymc.neo-loom-remap
loomx.loom_unobf_plugin = org.relativitymc.neo-loom

# Libraries
deps.kaleido=0.3.3+1.3.2

# Publishing
publish.modrinth=ItRx1oj3
